<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="DrDer Chess - لعبة شطرنج احترافية">
    
    <title>DrDer Chess</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- الشاشة الرئيسية -->
    <div id="mainMenu" class="screen active">
        <div class="menu-container">
            <div class="logo-container">
                <img src="192.png" alt="DrDer Chess Logo" class="logo-icon">
                <h1 class="game-title">DrDer Chess</h1>
                <p class="game-subtitle">الشطرنج كما يجب أن يكون</p>
            </div>
            
            <div class="menu-buttons">
                <button id="playComputerBtn" class="menu-btn primary-btn">
                    <span class="btn-icon">🤖</span>
                    <span class="btn-text">العب ضد الكمبيوتر</span>
                </button>
                
                <button id="twoPlayersBtn" class="menu-btn secondary-btn">
                    <span class="btn-icon">👥</span>
                    <span class="btn-text">لاعبان على نفس الجهاز</span>
                </button>
                
                <button id="settingsBtn" class="menu-btn tertiary-btn">
                    <span class="btn-icon">⚙️</span>
                    <span class="btn-text">الإعدادات</span>
                </button>
            </div>
            
            <div id="continueGameContainer" class="continue-container hidden">
                <button id="continueGameBtn" class="menu-btn accent-btn">
                    <span class="btn-icon">▶️</span>
                    <span class="btn-text">متابعة المباراة السابقة</span>
                </button>
            </div>
        </div>
    </div>

    <!-- شاشة اختيار المستوى -->
    <div id="levelSelect" class="screen">
        <div class="back-header">
            <button id="backFromLevelBtn" class="back-btn">← رجوع</button>
            <h2>اختر مستوى الذكاء</h2>
        </div>
        <div class="level-buttons">
            <button class="level-btn easy-btn" data-level="easy">
                <span>سهل</span>
                <small>مستوى مبتدئ</small>
            </button>
            <button class="level-btn medium-btn" data-level="medium">
                <span>متوسط</span>
                <small>مستوى متوسط</small>
            </button>
            <button class="level-btn hard-btn" data-level="hard">
                <span>صعب</span>
                <small>مستوى متقدم</small>
            </button>
            <button class="level-btn expert-btn" data-level="expert">
                <span>محترف</span>
                <small>أقصى قوة</small>
            </button>
        </div>
    </div>

    <!-- شاشة اللعبة -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button id="backToMenuBtn" class="back-btn">← القائمة</button>
            <div class="game-status">
                <span id="gameStatusText">دور الأبيض</span>
                <span id="moveCounter" class="move-counter"></span>
            </div>
            <button id="saveGameBtn" class="icon-btn" title="حفظ المباراة">💾</button>
        </div>
        
        <div class="board-wrapper">
            <div id="chessboard" class="chessboard-container"></div>
        </div>
        
        <div class="game-footer">
            <div class="player-info">
                <div class="player black-player">
                    <span class="player-color">⚫</span>
                    <span class="player-name" id="blackPlayerName">الأسود</span>
                </div>
                <div class="captured-pieces" id="capturedByWhite"></div>
            </div>
            <div class="player-info">
                <div class="player white-player">
                    <span class="player-color">⚪</span>
                    <span class="player-name" id="whitePlayerName">الأبيض</span>
                </div>
                <div class="captured-pieces" id="capturedByBlack"></div>
            </div>
        </div>
        
        <!-- نافذة الترقية -->
        <div id="promotionModal" class="modal hidden">
            <div class="modal-content">
                <h3>اختر ترقية البيدق</h3>
                <div class="promotion-pieces" id="promotionPieces"></div>
            </div>
        </div>
        
        <!-- نافذة نهاية اللعبة -->
        <div id="gameOverModal" class="modal hidden">
            <div class="modal-content">
                <h2 id="gameOverTitle"></h2>
                <p id="gameOverMessage"></p>
                <div class="modal-buttons">
                    <button id="newGameBtn" class="menu-btn primary-btn">لعبة جديدة</button>
                    <button id="reviewGameBtn" class="menu-btn secondary-btn">مراجعة الرقعة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- شاشة الإعدادات -->
    <div id="settingsScreen" class="screen">
        <div class="back-header">
            <button id="backFromSettingsBtn" class="back-btn">← رجوع</button>
            <h2>الإعدادات</h2>
        </div>
        <div class="settings-container">
            <div class="setting-item">
                <span>🔊 الصوت</span>
                <label class="toggle">
                    <input type="checkbox" id="soundToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>📍 إحداثيات الرقعة</span>
                <label class="toggle">
                    <input type="checkbox" id="coordsToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>🟢 النقلات القانونية</span>
                <label class="toggle">
                    <input type="checkbox" id="legalMovesToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <button id="resetSettingsBtn" class="menu-btn tertiary-btn">
                إعادة ضبط الإعدادات
            </button>
        </div>
    </div>

    <!-- المكتبات - تحميل بالترتيب -->
    <script src="libs/chess.min.js"></script>
    <script src="libs/chessboard.min.js"></script>
    <script src="libs/stockfish.js"></script>
    <script src="app.js"></script>
</body>
</html>
