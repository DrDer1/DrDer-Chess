<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrDer Chess - اختبار</title>
    <style>
        body {
            background: #0d0d1a;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        button {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            background: #4fc3f7;
            border: none;
            border-radius: 10px;
            color: #000;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>اختبار DrDer Chess</h1>
    
    <div id="mainMenu">
        <p>القائمة الرئيسية</p>
        <button onclick="alert('زر الكمبيوتر يعمل')">العب ضد الكمبيوتر</button>
        <button onclick="alert('زر اللاعبين يعمل')">لاعبان</button>
        <button onclick="alert('زر الإعدادات يعمل')">الإعدادات</button>
    </div>

    <script>
        console.log('HTML loaded');
        alert('تم تحميل الصفحة بنجاح');
    </script>
    
    <script src="libs/chess.min.js"></script>
    <script>
        console.log('chess.js loaded:', typeof Chess);
        alert('chess.js: ' + (typeof Chess === 'function' ? 'تم التحميل ✓' : 'فشل التحميل ✗'));
    </script>
    
    <script src="libs/chessboard.min.js"></script>
    <script>
        console.log('chessboard.js loaded:', typeof Chessboard);
        alert('chessboard.js: ' + (typeof Chessboard === 'function' ? 'تم التحميل ✓' : 'فشل التحميل ✗'));
    </script>
    
    <script src="app.js"></script>
</body>
</html>
