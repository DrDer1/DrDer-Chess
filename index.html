<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="DrDer Chess - لعبة شطرنج احترافية">
    
    <title>DrDer Chess</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- الشاشة الرئيسية -->
    <div id="mainMenu" class="screen active">
        <div class="menu-container">
            <div class="logo-container">
                <img src="192.png" alt="DrDer Chess Logo" class="logo-icon">
                <h1 class="game-title">DrDer Chess</h1>
                <p class="game-subtitle">الشطرنج كما يجب أن يكون</p>
            </div>
            
            <div class="menu-buttons">
                <button id="playComputerBtn" class="menu-btn primary-btn" type="button">
                    <span class="btn-icon">🤖</span>
                    <span class="btn-text">العب ضد الكمبيوتر</span>
                </button>
                
                <button id="twoPlayersBtn" class="menu-btn secondary-btn" type="button">
                    <span class="btn-icon">👥</span>
                    <span class="btn-text">لاعبان على نفس الجهاز</span>
                </button>
            </div>
        </div>
    </div>

    <!-- شاشة اللعبة -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button id="backToMenuBtn" class="back-btn" type="button">← القائمة</button>
            <div class="game-status">
                <span id="gameStatusText">دور الأبيض</span>
                <span id="moveCounter" class="move-counter"></span>
            </div>
            <div style="width:40px;"></div>
        </div>
        
        <div class="opponent-name" id="opponentName">الكمبيوتر</div>
        
        <div class="board-wrapper">
            <div id="chessboard" class="chessboard-container"></div>
        </div>
        
        <div class="player-name-bottom" id="playerNameBottom">DrDer</div>
        
        <div class="game-footer">
            <div class="player-info">
                <span class="player-color">⚫</span>
                <span class="captured-pieces" id="capturedByWhite"></span>
            </div>
            <div class="player-info">
                <span class="player-color">⚪</span>
                <span class="captured-pieces" id="capturedByBlack"></span>
            </div>
        </div>
        
        <div id="promotionModal" class="modal hidden">
            <div class="modal-content">
                <h3>اختر ترقية البيدق</h3>
                <div class="promotion-pieces" id="promotionPieces"></div>
            </div>
        </div>
        
        <div id="gameOverModal" class="modal hidden">
            <div class="modal-content">
                <h2 id="gameOverTitle"></h2>
                <p id="gameOverMessage"></p>
                <div class="modal-buttons">
                    <button id="newGameBtn" class="menu-btn primary-btn" type="button">لعبة جديدة</button>
                    <button id="reviewGameBtn" class="menu-btn secondary-btn" type="button">مراجعة الرقعة</button>
                </div>
            </div>
        </div>
    </div>

    <script src="chess.min.js"></script>
    <script src="game.js"></script>
    <script src="app.js"></script>
</body>
</html>
